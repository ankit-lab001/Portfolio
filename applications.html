<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Applications by Ankit Kumar Singh">

    <title>Applications | Ankit Kumar Singh</title>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

:root {
    --bg: #f7f9ff;
    --bg2: #eef4ff;
    --text: #111827;
    --muted: #64748b;

    --purple: #6c3cff;
    --blue: #00b7ff;
    --pink: #ff3cac;
    --orange: #ff9f43;

    --glass: rgba(255,255,255,0.72);
    --border: rgba(108,60,255,0.15);

    --shadow:
        0 25px 70px rgba(50,40,120,0.12);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 10% 10%, rgba(108,60,255,.14), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,183,255,.13), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(255,60,172,.10), transparent 35%),
        var(--bg);

    overflow-x: hidden;
    position: relative;
}

/* ANIMATED LIGHT BLOBS */

body::before {
    content: "";
    position: fixed;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    background:
        radial-gradient(circle,
        rgba(108,60,255,.28),
        rgba(108,60,255,0));

    filter: blur(20px);

    top: -180px;
    left: -160px;

    animation: blobMove 10s ease-in-out infinite;

    z-index: -3;
}

body::after {
    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        radial-gradient(circle,
        rgba(0,183,255,.22),
        rgba(0,183,255,0));

    filter: blur(20px);

    right: -200px;
    bottom: -180px;

    animation: blobMove2 12s ease-in-out infinite;

    z-index: -3;
}

@keyframes blobMove {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(130px,120px) scale(1.2);
    }
}

@keyframes blobMove2 {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(-120px,-100px) scale(1.2);
    }
}

/* MOVING GRID */

body {
    background-image:
        linear-gradient(rgba(108,60,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,60,255,.035) 1px, transparent 1px),
        radial-gradient(circle at 10% 10%, rgba(108,60,255,.12), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,183,255,.12), transparent 28%);

    background-size:
        45px 45px,
        45px 45px,
        auto,
        auto;

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0, 0 0, 0 0, 0 0;
    }

    to {
        background-position: 45px 45px, 45px 45px, 0 0, 0 0;
    }
}

/* PARTICLES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}

.particle {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--purple);

    box-shadow:
        0 0 15px var(--purple);

    animation: particleFloat linear infinite;
}

.particle:nth-child(1) {
    left: 10%;
    top: 90%;
    animation-duration: 9s;
}

.particle:nth-child(2) {
    left: 20%;
    top: 80%;
    animation-duration: 12s;
}

.particle:nth-child(3) {
    left: 35%;
    top: 95%;
    animation-duration: 10s;
}

.particle:nth-child(4) {
    left: 50%;
    top: 85%;
    animation-duration: 14s;
}

.particle:nth-child(5) {
    left: 65%;
    top: 90%;
    animation-duration: 11s;
}

.particle:nth-child(6) {
    left: 80%;
    top: 75%;
    animation-duration: 13s;
}

.particle:nth-child(7) {
    left: 92%;
    top: 90%;
    animation-duration: 10s;
}

@keyframes particleFloat {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        transform: translateY(-800px) scale(1.3);
        opacity: 0;
    }
}

/* NAVBAR */

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 8%;

    background: rgba(255,255,255,.72);

    backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(108,60,255,.12);

    box-shadow:
        0 10px 35px rgba(50,40,120,.06);
}

.logo {
    font-family: 'Space Grotesk', sans-serif;

    font-size: 27px;
    font-weight: 800;

    text-decoration: none;

    color: var(--text);
}

.logo span {
    color: var(--purple);
}

.back-btn {
    color: var(--text);

    text-decoration: none;

    padding: 10px 20px;

    border: 1px solid rgba(108,60,255,.2);

    border-radius: 30px;

    background: rgba(255,255,255,.65);

    backdrop-filter: blur(10px);

    transition: .35s;

    font-weight: 600;
}

.back-btn:hover {
    color: white;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    transform: translateY(-4px);

    box-shadow:
        0 12px 30px rgba(108,60,255,.25);
}

/* PAGE HEADER */

.page-header {
    padding: 90px 8% 45px;

    animation: headerAppear 1s ease;
}

.page-header p {
    color: var(--purple);

    font-size: 14px;

    font-weight: 800;

    letter-spacing: 2px;

    margin-bottom: 10px;
}

.page-header h1 {
    font-family: 'Space Grotesk', sans-serif;

    font-size: clamp(42px, 7vw, 70px);

    line-height: 1.05;

    margin-bottom: 18px;
}

.page-header h1 span {
    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--blue),
            var(--pink)
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: gradientText 5s linear infinite;
}

@keyframes gradientText {
    to {
        background-position: 200% center;
    }
}

.page-header .line {
    width: 90px;
    height: 5px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--blue),
            var(--pink)
        );

    animation: lineGrow 1.2s ease;
}

@keyframes headerAppear {
    from {
        opacity: 0;
        transform: translateY(35px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lineGrow {
    from {
        width: 0;
    }

    to {
        width: 90px;
    }
}

/* APPLICATION AREA */

.applications-area {
    padding: 35px 8% 110px;

    display: flex;

    gap: 35px;

    flex-wrap: wrap;
}

/* APP CARD */

.app-card {
    width: 300px;
    height: 300px;

    padding: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.85),
            rgba(246,248,255,.65)
        );

    border: 1px solid var(--border);

    border-radius: 30px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    opacity: 0;

    transform: translateY(40px);

    animation: cardAppear .8s ease forwards;

    transition: .45s ease;

    box-shadow: var(--shadow);
}

.app-card::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(108,60,255,.20),
            transparent
        );

    top: -70px;
    right: -70px;

    transition: .5s;
}

.app-card::after {
    content: "";

    position: absolute;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    border: 1px solid rgba(0,183,255,.15);

    bottom: -65px;
    left: -65px;

    animation: miniOrbit 6s linear infinite;
}

@keyframes miniOrbit {
    to {
        transform: rotate(360deg);
    }
}

.app-card:hover {
    transform:
        translateY(-14px)
        scale(1.035);

    border-color: rgba(108,60,255,.35);

    box-shadow:
        0 30px 80px rgba(108,60,255,.18);
}

.app-card:hover::before {
    transform: scale(1.5);
}

/* APP ICON */

.app-icon {
    width: 82px;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 24px;

    font-size: 40px;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    box-shadow:
        0 15px 35px rgba(108,60,255,.25);

    margin-bottom: 20px;

    animation: iconFloat 3s ease-in-out infinite;

    position: relative;
    z-index: 2;
}

@keyframes iconFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-8px) rotate(3deg);
    }
}

.app-card h2 {
    font-family: 'Space Grotesk', sans-serif;

    font-size: 22px;

    margin-bottom: 22px;

    position: relative;
    z-index: 2;
}

/* BUTTONS */

.app-buttons {
    display: flex;

    gap: 10px;

    position: relative;
    z-index: 2;
}

.app-btn {
    padding: 11px 16px;

    border-radius: 30px;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    transition: .35s;
}

.view-btn {
    color: white;

    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--blue)
        );

    box-shadow:
        0 10px 25px rgba(108,60,255,.22);
}

.view-btn:hover {
    transform: translateY(-4px) scale(1.04);

    box-shadow:
        0 15px 35px rgba(108,60,255,.32);
}

.download-btn {
    color: var(--text);

    background: rgba(255,255,255,.8);

    border: 1px solid rgba(108,60,255,.18);
}

.download-btn:hover {
    color: white;

    background: var(--text);

    border-color: var(--text);

    transform: translateY(-4px);
}

/* CARD ANIMATION */

@keyframes cardAppear {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */

footer {
    padding: 35px;

    text-align: center;

    color: var(--muted);

    font-size: 13px;

    border-top:
        1px solid rgba(108,60,255,.10);

    background: rgba(255,255,255,.45);

    backdrop-filter: blur(15px);
}

/* MOBILE */

@media (max-width: 650px) {

    .navbar {
        padding: 15px 5%;
    }

    .page-header {
        padding: 65px 5% 30px;
    }

    .applications-area {
        padding: 25px 5% 80px;

        justify-content: center;
    }

    .app-card {
        width: min(300px, 90vw);
        height: 300px;
    }

    .page-header h1 {
        font-size: 45px;
    }
}
</style>

</head>
