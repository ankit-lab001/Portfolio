<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Applications by Ankit Kumar Singh">

    <title>Applications | Ankit Kumar Singh</title>

    <style>

        /* ================= GLOBAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            color: white;

            background: #080810;

            overflow-x: hidden;

            position: relative;
        }


        /* ================= ANIMATED BACKGROUND ================= */

        body::before {

            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            background: #6542d3;

            opacity: 0.12;

            filter: blur(100px);

            top: -180px;
            left: -150px;

            animation: moveGlow 8s ease-in-out infinite;

            z-index: -2;
        }


        body::after {

            content: "";

            position: fixed;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: #3c72d8;

            opacity: 0.10;

            filter: blur(100px);

            right: -150px;
            bottom: -150px;

            animation: moveGlow2 10s ease-in-out infinite;

            z-index: -2;
        }


        @keyframes moveGlow {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(120px, 100px);
            }

        }


        @keyframes moveGlow2 {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-100px, -80px);
            }

        }


        /* ================= FLOATING PARTICLES ================= */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;
        }


        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            background: rgba(255,255,255,0.35);

            border-radius: 50%;

            animation: particleFloat linear infinite;
        }


        .particle:nth-child(1) {
            left: 10%;
            top: 80%;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            left: 20%;
            top: 70%;
            animation-duration: 11s;
        }

        .particle:nth-child(3) {
            left: 35%;
            top: 90%;
            animation-duration: 9s;
        }

        .particle:nth-child(4) {
            left: 50%;
            top: 75%;
            animation-duration: 12s;
        }

        .particle:nth-child(5) {
            left: 65%;
            top: 85%;
            animation-duration: 10s;
        }

        .particle:nth-child(6) {
            left: 80%;
            top: 65%;
            animation-duration: 13s;
        }

        .particle:nth-child(7) {
            left: 90%;
            top: 80%;
            animation-duration: 9s;
        }


        @keyframes particleFloat {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-700px);
                opacity: 0;
            }

        }


        /* ================= NAVBAR ================= */

        .navbar {

            position: sticky;

            top: 0;

            z-index: 100;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px 8%;

            background:
                rgba(8, 8, 16, 0.82);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(255,255,255,0.07);
        }


        .logo {

            color: white;

            text-decoration: none;

            font-size: 26px;

            font-weight: bold;
        }


        .logo span {
            color: #7c4dff;
        }


        .back-btn {

            color: #d8d8e5;

            text-decoration: none;

            padding: 9px 18px;

            border:
                1px solid #3a3a4d;

            border-radius: 25px;

            font-size: 14px;

            transition: 0.3s;
        }


        .back-btn:hover {

            color: white;

            background: #6542d3;

            border-color: #6542d3;

            transform: translateY(-2px);
        }


        /* ================= PAGE HEADER ================= */

        .page-header {

            padding: 70px 8% 35px;

            animation: headerAppear 1s ease;
        }


        .page-header p {

            color: #8b6cff;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }


        .page-header h1 {

            font-size: clamp(40px, 6vw, 60px);

            line-height: 1.1;

            margin-bottom: 12px;
        }


        .page-header h1 span {

            color: #7c4dff;
        }


        .page-header .line {

            width: 70px;

            height: 4px;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #6542d3,
                    #5366d9
                );

            animation: lineGrow 1.2s ease;
        }


        @keyframes headerAppear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @keyframes lineGrow {

            from {
                width: 0;
            }

            to {
                width: 70px;
            }

        }


        /* ================= APPLICATION AREA ================= */

        .applications-area {

            padding: 30px 8% 100px;

            display: flex;

            justify-content: flex-start;

            align-items: flex-start;

            gap: 30px;

            flex-wrap: wrap;
        }


        /* ================= SQUARE APP CARD ================= */

        .app-card {

            width: 280px;

            height: 280px;

            padding: 25px;

            background:
                rgba(18,18,31,0.88);

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 24px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            position: relative;

            overflow: hidden;

            opacity: 0;

            transform: translateY(35px);

            animation: cardAppear 0.8s ease forwards;

            transition: 0.4s ease;
        }


        .app-card::before {

            content: "";

            position: absolute;

            width: 140px;

            height: 140px;

            border-radius: 50%;

            background: #6542d3;

            opacity: 0.08;

            filter: blur(30px);

            top: -50px;

            right: -50px;

            transition: 0.4s;
        }


        .app-card:hover {

            transform:
                translateY(-10px)
                scale(1.02);

            border-color:
                rgba(124,77,255,0.55);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.35);
        }


        .app-card:hover::before {

            transform: scale(1.5);

            opacity: 0.14;
        }


        @keyframes cardAppear {

            to {

                opacity: 1;

                transform: translateY(0);
            }

        }


        /* ================= APP ICON ================= */

        .app-icon {

            width: 75px;

            height: 75px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #6542d3,
                    #5366d9
                );

            box-shadow:
                0 10px 25px
                rgba(0,0,0,0.25);

            margin-bottom: 18px;

            animation:
                iconFloat 3s ease-in-out infinite;
        }


        @keyframes iconFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

        }


        /* ================= APP NAME ================= */

        .app-card h2 {

            font-size: 21px;

            margin-bottom: 22px;
        }


        /* ================= BUTTONS ================= */

        .app-buttons {

            display: flex;

            gap: 9px;

            justify-content: center;
        }


        .app-btn {

            padding:
                10px 15px;

            border-radius: 25px;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            transition: 0.3s;
        }


        /* VIEW */

        .view-btn {

            color: white;

            background: #6542d3;
        }


        .view-btn:hover {

            background: #7655df;

            transform:
                translateY(-3px);
        }


        /* DOWNLOAD */

        .download-btn {

            color: white;

            background: transparent;

            border:
                1px solid #4a4a5d;
        }


        .download-btn:hover {

            color: #0b0b14;

            background: white;

            border-color: white;

            transform:
                translateY(-3px);
        }


        /* ================= FOOTER ================= */

        footer {

            padding: 30px;

            text-align: center;

            color: #777784;

            font-size: 13px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);
        }


        /* ================= MOBILE ================= */

        @media (max-width: 650px) {

            .navbar {

                padding:
                    15px 5%;
            }


            .page-header {

                padding:
                    55px 5% 25px;
            }


            .applications-area {

                padding:
                    25px 5% 70px;

                justify-content: center;
            }


            .app-card {

                width: 280px;

                height: 280px;
            }

        }

    </style>

</head>


<body>

    <nav class="navbar">

        <a

    <!-- ================= PAGE HEADER ================= -->

    <header class="page-header">

    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Ankit Kumar Singh

    </footer>


</body>

</html>
